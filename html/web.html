<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement Web App</title>
    <link rel="stylesheet" href="../css/style.css"

<div id="header">
    <h1>Welcome to Quantity Measurement</h1>
</div>

<div class="container">

    <!-- TYPE SELECTION -->
    <div class="section-title">CHOOSE TYPE</div>

    <div id="types">
        <div class="card type-card" data-type="Length">
            <h3>Length</h3>
        </div>
        <div class="card type-card" data-type="Weight">
            <h3>Weight</h3>
        </div>
        <div class="card type-card" data-type="Temperature">
            <h3>Temperature</h3>
        </div>
        <div class="card type-card" data-type="Volume">
            <h3>Volume</h3>
        </div>
    </div>

    <!-- INPUT SECTION -->
    <div class="section-title">CONVERSION</div>

    <div id="input-section">
        <div class="input-box">
            <label>FROM</label>
            <input type="number" id="fromValue">
            <select id="fromUnit"></select>
        </div>

        <div class="input-box">
            <label>TO</label>
            <input type="number" id="toValue" readonly>
            <select id="toUnit"></select>
        </div>
    </div>

    <!-- CONVERT BUTTON -->
    <button id="convertBtn">Convert</button>

    <!-- RESULT PANEL -->
    <div class="section-title">RESULT</div>
    <div id="result-panel">
        <span id="result-value">—</span>
        <span id="result-unit"></span>
    </div>

    <!-- HISTORY -->
    <div class="section-title">HISTORY</div>
    <ul id="history-list"></ul>

</div>

  <script type="module" src="../js/script.js"></script>
</body>
</html>
